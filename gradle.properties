# Gradle
org.gradle.jvmargs=-Xmx2G
# JDK 17 for the Java 8 builds (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loader plugins prepare Minecraft for each module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true

# Mod
mod_version=1.2.0
maven_group=com.kasper.mobsenses

# Simple Voice Chat API (optional runtime integration on Fabric, Forge, NeoForge, and Bukkit/Paper)
voicechat_api_version=2.5.27

# Bukkit / Spigot / Paper / Purpur / Folia 1.16.5+ (Java 8 bytecode) - server side only
bukkit_api_version=1.16.5-R0.1-SNAPSHOT
# The parts that need a newer API (game events since 1.17, Folia's schedulers) compile against this one
bukkit_modern_api_version=1.20.1-R0.1-SNAPSHOT

# Minecraft 1.16.5 (Java 8 bytecode via Jabel)
mc116_minecraft=1.16.5
mc116_fabric_loader=0.14.21
mc116_fabric_api=0.42.0+1.16

# Minecraft 1.17 - 1.20.4 (Java 16 bytecode) - compiled against 1.17.1
mc117_minecraft=1.17.1
mc117_fabric_loader=0.14.21
mc117_fabric_api=0.46.1+1.17

# Minecraft 1.20.5 - 1.21.11 (Java 21) - compiled against 1.21.8, binary-compatible across the range
mc121_minecraft=1.21.8
mc121_fabric_loader=0.16.13
mc121_fabric_api=0.136.1+1.21.8

# Minecraft 26.x (Java 25, unobfuscated) - compiled against 26.3, runs on 26.1 - 26.3
# (checked on every 26.x release by .github/workflows/compat-26.yml)
mc26_minecraft=26.3
mc26_fabric_loader=0.19.5
mc26_fabric_api=0.161.0+26.3

# Forge 1.16.5 - 1.20.4 (forge-1.20.1, Java 8 bytecode via Jabel)
forge120_version=1.20.1-47.4.0
forge120_version_oldest=1.20-46.0.14
# NeoForge for 1.20.1 is a fork of Forge and loads the Forge 1.20.1 jar (net.neoforged:forge)
nf1201_forge=1.20.1-47.1.106

# Forge 1.20.5 - 1.21.10 (forge-1.21.10)
forge12110_minecraft=1.21.10
forge12110_version=1.21.10-60.1.18

# Forge 1.21.11 (forge-1.21.11)
forge12111_minecraft=1.21.11
forge12111_version=1.21.11-61.2.4
forge12111_version_oldest=1.21.11-61.0.1

# Forge 26.x (forge-26)
forge26_minecraft=26.3
forge26_version=26.3-66.0.13

# NeoForge 1.20.2 - 1.21.8 (neoforge-1.21)
nf121_neoforge=21.1.172
nf121_neoforge_oldest=21.0.167

# NeoForge 1.21.9 - 1.21.10 (neoforge-1.21.10)
nf12110_neoforge=21.10.64

# NeoForge 1.21.11 (neoforge-1.21.11)
nf12111_neoforge=21.11.48

# NeoForge 26.x (neoforge-26)
nf26_neoforge=26.3.0.95
nf26_neoforge_oldest=26.1.2.122
