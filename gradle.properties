# Gradle
org.gradle.jvmargs=-Xmx2G
# JDK 17 for the Java 8 builds (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loader plugins prepare Minecraft for each module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true

# Mod
mod_version=1.6.0
maven_group=com.kasper.mobsenses

# Simple Voice Chat API (optional runtime integration on Fabric, Forge, NeoForge, and Bukkit/Paper)
voicechat_api_version=2.5.27

# Bukkit / Spigot / Paper / Purpur / Folia 1.16.5+ (Java 8 bytecode) - server side only
bukkit_api_version=1.16.5-R0.1-SNAPSHOT
# The parts that need a newer API (game events since 1.17, Folia's schedulers) compile against this one
bukkit_modern_api_version=1.20.1-R0.1-SNAPSHOT

# Fabric 1.16.5 (Java 8 bytecode via Jabel)
mc116_minecraft=1.16.5
mc116_fabric_loader=0.14.21
mc116_fabric_api=0.42.0+1.16

