description = '''
Mobs hear your steps, blocks, doors and fights through walls, see your light and, with Simple Voice Chat, hear your voice. Works on the server alone; vanilla clients can join.

Мобы слышат шаги, блоки, двери и бой сквозь стены, видят ваш свет, а с Simple Voice Chat слышат и голос. Хватает мода на сервере; ванильные клиенты могут заходить.
'''

