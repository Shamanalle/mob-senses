plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'java'
}

ext {
    bandTarget = "mc1.21-1.21.1"
    neoforgeVersion = project.nf121_neoforge
}

apply from: "${rootDir}/gradle/neoforge-band.gradle"

useShared([
        'shared/neoforge',
        'shared/mc-gui',
        'shared/mc-1.21.8',
        'shared/mc-1.21.10',
        'shared/mc-all',
])
