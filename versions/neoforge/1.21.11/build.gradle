plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'java'
}

ext {
    bandTarget = "mc1.21.11"
    neoforgeVersion = project.nf12111_neoforge
}

apply from: "${rootDir}/gradle/neoforge-band.gradle"

sourceSets.main.java {
    srcDir "${rootDir}/versions/neoforge/1.21/src/main/java"
    exclude { e -> !e.directory && e.file.toPath().startsWith(file("${rootDir}/versions/neoforge/1.21/src/main/java/com/kasper/mobsenses/server").toPath()) }
}
