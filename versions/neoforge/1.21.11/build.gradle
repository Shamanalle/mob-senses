plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'java'
}

ext {
    bandTarget = "mc1.21.11"
    neoforgeVersion = project.nf12111_neoforge
}

apply from: "${rootDir}/gradle/neoforge-band.gradle"

useShared([
        'shared/neoforge',
        'shared/mc-1.21.11',
        'shared/mc-gui',
        'shared/mc-all',
])
