plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '[7.0.80,7.1)'
}

// NeoForge 1.20.4: first CustomPacketPayload API (RegisterPayloadHandlerEvent + IPayloadRegistrar).
def repoRoot = file('../../..')
def props = new Properties()
new File(repoRoot, 'gradle.properties').withInputStream { props.load(it) }

def neoforge = project.findProperty('loaderOverride') ?: props.getProperty('nf1204_neoforge')
def modVersion = props.getProperty('mod_version')

version = "${modVersion}+mc1.20.4"
group = props.getProperty('maven_group')

base {
    archivesName = 'mob-senses-neoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

def ownRoot = file('src/main/java')
def sharedRoots = [
        "${repoRoot}/shared/mc-gui/src/main/java",
        "${repoRoot}/shared/mc-1.21.8/src/main/java",
        "${repoRoot}/shared/mc-1.21.10/src/main/java",
        "${repoRoot}/shared/mc-all/src/main/java",
        "${repoRoot}/common/src/main/java",
].collect { new File(it) }

sourceSets {
    main {
        java {
            sharedRoots.each { srcDir it }
            exclude { FileTreeElement e ->
                if (e.directory) {
                    return false
                }
                def path = e.relativePath.pathString
                def index = sharedRoots.findIndexOf { e.file.path.startsWith(it.path + File.separator) }
                if (index < 0) {
                    return false
                }
                def before = [ownRoot] + sharedRoots.take(index)
                before.any { new File(it, path).exists() }
            }
        }
        resources {
            srcDir "${repoRoot}/common/src/main/resources"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${props.getProperty('voicechat_api_version')}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') {
        expand 'version': version
    }
    filesMatching('mobsenses-build.properties') {
        expand 'version': modVersion
    }
}
