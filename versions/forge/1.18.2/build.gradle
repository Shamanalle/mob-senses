plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

evaluationDependsOn(':common')
apply from: "${rootDir}/gradle/shared-sources.gradle"

def target = "mc1.18-1.18.2"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-forge"
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge118_version
}

useShared([
        'shared/forge-net-1.18',
        'shared/mc-1.18',
        'shared/mc-1.19',
        'shared/mc-pose',
        'shared/mc-1.21.8',
        'shared/mc-1.21.10',
        'shared/mc-all',
])

dependencies {
    implementation project(':common')
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}
