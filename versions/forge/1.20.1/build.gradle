plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

evaluationDependsOn(':common')

def target = "mc1.20-1.20.4"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-forge"
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge120_version
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}
