plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

evaluationDependsOn(':common-j8')
apply from: "${rootDir}/gradle/shared-sources.gradle"

def target = "mc1.16.5"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-fabric"
}

repositories {
    mavenCentral()
}

apply from: "${rootDir}/gradle/jabel.gradle"

useShared([
        'shared/fabric',
        'shared/fabric-client-1.16',
        'shared/fabric-net-1.16',
        'shared/mc-1.16',
        'shared/mc-1.18',
        'shared/mc-1.19',
        'shared/mc-pose',
        'shared/mc-1.21.8',
        'shared/mc-1.21.10',
        'shared/mc-all',
])

dependencies {
    implementation project(':common-j8')

    minecraft "com.mojang:minecraft:${project.mc116_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc116_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc116_fabric_api}"
}

loom {
    mixin {
        defaultRefmapName = "mobsenses-refmap.json"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common-j8').sourceSets.main.output
    exclude 'com/terraformersmc/**'
}

remapJar {
    archiveClassifier = ''
}
