plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

evaluationDependsOn(':common')
apply from: "${rootDir}/gradle/shared-sources.gradle"

def target = "mc1.20.5-1.20.6"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-fabric"
}

repositories {
    mavenCentral()
}

useShared([
        'shared/fabric',
        'shared/fabric-client-1.20',
        'shared/fabric-net-1.21',
        'shared/fabric-mixin-1.21',
        'shared/mc-gui',
        'shared/mc-1.21.8',
        'shared/mc-1.21.10',
        'shared/mc-all',
])

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc1206_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc1206_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc1206_fabric_api}"
}

loom {
    mixin {
        defaultRefmapName = "mobsenses-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
    exclude 'com/terraformersmc/**'
}

remapJar {
    archiveClassifier = ''
}
