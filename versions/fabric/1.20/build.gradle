plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

evaluationDependsOn(':common')

// Minecraft 1.20 - 1.20.4 (compiled against 1.20.1, Java 17 bytecode)
def target = "mc1.20-1.20.4"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-fabric"
}

repositories {
    mavenCentral()
}

def src116 = file("${rootDir}/versions/fabric/1.16/src/main/java").toPath()
def src119 = file("${rootDir}/versions/fabric/1.19/src/main/java").toPath()
def src1194 = file("${rootDir}/versions/fabric/1.19.4/src/main/java").toPath()
def src121 = file("${rootDir}/versions/fabric/1.21/src/main/java").toPath()

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
            srcDir "${rootDir}/versions/fabric/1.16/src/main/java"
            srcDir "${rootDir}/versions/fabric/1.19/src/main/java"
            srcDir "${rootDir}/versions/fabric/1.19.4/src/main/java"
            srcDir "${rootDir}/versions/fabric/1.21/src/main/java"
            exclude { e ->
                if (e.directory) return false
                def p = e.file.toPath()
                if (p.startsWith(src116)) {
                    def rel = src116.relativize(p).toString().replace('\\', '/')
                    return rel != 'com/kasper/mobsenses/server/AdminPermission.java'
                }
                if (p.startsWith(src119)) {
                    def rel = src119.relativize(p).toString().replace('\\', '/')
                    return rel != 'com/kasper/mobsenses/mixin/ServerLevelMixin.java'
                }
                if (p.startsWith(src1194)) {
                    def rel = src1194.relativize(p).toString().replace('\\', '/')
                    return rel != 'com/kasper/mobsenses/server/GameEventHook.java'
                }
                if (p.startsWith(src121)) {
                    def rel = src121.relativize(p).toString().replace('\\', '/')
                    return rel != 'com/kasper/mobsenses/GuiCanvas.java'
                            && rel != 'com/kasper/mobsenses/MobSensesFabric.java'
                            && rel != 'com/kasper/mobsenses/server/Worlds.java'
                }
                return false
            }
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc120_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc120_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc120_fabric_api}"
}

loom {
    mixin {
        defaultRefmapName = "mobsenses-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}
