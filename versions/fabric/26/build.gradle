plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java'
}

evaluationDependsOn(':common')
apply from: "${rootDir}/gradle/shared-sources.gradle"

// Minecraft 26.1 - 26.3 (compiled against 26.3, unobfuscated: no remapping)
def target = "mc26.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-fabric"
}

repositories {
    mavenCentral()
}

useShared([
        'shared/fabric',
        'shared/fabric-net-26',
        'shared/mc-26',
        'shared/mc-all',
])

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc26_minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.mc26_fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc26_fabric_api}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
    exclude 'com/terraformersmc/**'
}

tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def files = sourceSets.main.compileClasspath
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = files.files.join('\n') + '\n'
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mobsenses-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java {
            srcDir "${rootDir}/shared/gametest/src/java"
        }
        resources {
            srcDir "${rootDir}/common/src/main/resources"
            include "assets/**", "data/**", "fabric.mod.json"
        }
    }
}
