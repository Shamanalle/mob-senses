plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

evaluationDependsOn(':common')
apply from: "${rootDir}/gradle/shared-sources.gradle"

// Minecraft 1.21 - 1.21.11 (compiled against 1.21.8, see gradle.properties)
def target = "mc1.21.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "mob-senses-fabric"
}

repositories {
    mavenCentral()
}

useShared([
        'shared/fabric',
        'shared/fabric-client-1.20',
        'shared/fabric-net-1.21',
        'shared/fabric-mixin-1.21',
        'shared/mc-gui',
        'shared/mc-1.21.8',
        'shared/mc-all',
])

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc121_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc121_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc121_fabric_api}"
}

loom {
    mixin {
        defaultRefmapName = "mobsenses-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
    exclude 'com/terraformersmc/**'
}

remapJar {
    archiveClassifier = ''
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mobsenses-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java {
            srcDir "${rootDir}/shared/gametest/src/java"
        }
        resources {
            srcDir "${rootDir}/common/src/main/resources"
            include "assets/**", "data/**", "fabric.mod.json"
        }
    }
}

tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
