plugins {
    id 'java'
}

// The dispatchers of the universal jars (see MergeJars and the root build.gradle): the only classes there that
// every Minecraft version loads, so they are Java 8 bytecode and use the loader API alone
repositories {
    mavenCentral()
    maven { url = uri("https://maven.fabricmc.net/") }
}

sourceSets {
    fabric
    // Forge's and NeoForge's annotations and constructor types, only to compile against: the real ones come with the loader
    stubs
    forge {
        compileClasspath += stubs.output
    }
    test {
        compileClasspath += forge.output + stubs.output
        runtimeClasspath += forge.output + stubs.output
    }
}

dependencies {
    // The oldest Fabric Loader any band allows, so nothing newer is used
    fabricCompileOnly("net.fabricmc:fabric-loader:0.14.21") {
        transitive = false
    }
    // The Mixin config plugin API, as Fabric Loader ships it
    fabricCompileOnly("net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5") {
        transitive = false
    }
    fabricCompileOnly 'org.ow2.asm:asm-tree:9.9.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = name == 'compileTestJava' ? 17 : 8
    options.encoding = 'UTF-8'
    // javac warns that release 8 is old; it is what Minecraft 1.16.5 runs on
    options.compilerArgs += ['-Xlint:-options']
}

test {
    useJUnitPlatform()
}
