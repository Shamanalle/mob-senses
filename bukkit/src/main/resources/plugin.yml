name: MobSenses
version: '${version}'
main: com.kasper.mobsenses.bukkit.MobSensesBukkit
api-version: '1.16'
folia-supported: true
author: Shamanalle
website: https://github.com/Shamanalle/mob-senses
description: Mobs hear your steps, blocks, doors and fights through walls, see your light and hear your voice in Simple Voice Chat.
softdepend: [voicechat]
commands:
  mobsenses:
    description: Mob Senses settings for admins
    usage: /mobsenses [status|preset|hearing|sight|voice|world|reload|help]
    permission: mobsenses.admin
permissions:
  mobsenses.admin:
    description: Use /mobsenses
    default: op
