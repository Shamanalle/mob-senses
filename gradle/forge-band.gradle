// Forge 1.20.6 - 26.x runs with Mojang's own names at runtime (no SRG reobfuscation).
// Compiling against Loom's cached Mojang-named Minecraft jar plus Forge's universal/userdev jars
// avoids running a second decompiler pipeline per band.
evaluationDependsOn(':common')

def targetName = project.ext.bandTarget
def mcVer = project.ext.mcVersion
def forgeVer = project.findProperty("loaderOverride.${project.name}") ?: project.ext.forgeVersion
def unobfuscated = project.ext.has('unobfuscated') && project.ext.unobfuscated

version = "${project.mod_version}+${targetName}"

base {
    archivesName = "mob-senses-forge"
}

repositories {
    maven { url = uri("https://maven.minecraftforge.net/") }
    maven { url = uri("https://libraries.minecraft.net/") }
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')
    minecraft "com.mojang:minecraft:${mcVer}"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    compileOnly "net.minecraftforge:forge:${forgeVer}:universal@jar"
    compileOnly "net.minecraftforge:forge:${forgeVer}:userdev@jar"
    compileOnly "net.minecraftforge:eventbus:7.0-beta.12@jar"
    compileOnly "net.minecraftforge:fmlcore:${forgeVer}@jar"
    compileOnly "net.minecraftforge:fmlloader:${forgeVer}@jar"
    compileOnly "net.minecraftforge:javafmllanguage:${forgeVer}@jar"
    compileOnly "net.minecraftforge:lowcodelanguage:${forgeVer}@jar"
    compileOnly "net.minecraftforge:mclanguage:${forgeVer}@jar"
}

def javaVer = unobfuscated ? 25 : 21

tasks.withType(JavaCompile).configureEach {
    options.release = javaVer
    options.encoding = 'UTF-8'
    if (unobfuscated) {
        doLast {
            // Forge 1.20.1 / NeoForge 1.21.1 scan every class in the universal jar with ASM at startup;
            // cap the class file version header at Java 21 (65) so older ASM readers do not reject it.
            destinationDirectory.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (f.name.endsWith('.class')) {
                    byte[] b = f.bytes
                    if (b.length >= 8 && b[7] == (byte) 69) {
                        b[7] = (byte) 65
                        f.bytes = b
                    }
                }
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

if (!unobfuscated) {
    remapJar {
        enabled = false
    }
}
